<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bodyGrad" cx="42%" cy="38%" r="58%">
      <stop offset="0%"   stop-color="#F0D050"/>
      <stop offset="45%"  stop-color="#C89010"/>
      <stop offset="100%" stop-color="#7A5500"/>
    </radialGradient>
    <radialGradient id="spikeGrad" cx="30%" cy="20%" r="70%">
      <stop offset="0%"   stop-color="#E0B828"/>
      <stop offset="100%" stop-color="#5A3E04"/>
    </radialGradient>
    <radialGradient id="fleshGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="100%" stop-color="#E0C040"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00000055"/>
    </filter>
  </defs>

  <!-- ── ALL SPIKES FIRST (behind body) ── -->
  <!-- Sharp triangular spikes radiating outward -->
  <!-- Top -->
  <polygon points="32,6  29,22 35,22" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Top-right 1 -->
  <polygon points="44,10  39,24 44,26" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Top-right 2 -->
  <polygon points="53,18  42,28 45,33" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Right -->
  <polygon points="58,34  43,31 43,37" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Bottom-right 1 -->
  <polygon points="53,50  42,38 45,43" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Bottom-right 2 -->
  <polygon points="43,58  37,44 41,43" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Bottom -->
  <polygon points="32,59  29,44 35,44" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Bottom-left 1 -->
  <polygon points="21,58  23,44 27,45" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Bottom-left 2 -->
  <polygon points="11,50  19,39 22,44" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Left -->
  <polygon points="6,34   21,31 21,37" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Top-left 1 -->
  <polygon points="11,18  20,28 24,24" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>
  <!-- Top-left 2 -->
  <polygon points="20,10  25,24 30,21" fill="url(#spikeGrad)" stroke="#3A2800" stroke-width="0.4"/>

  <!-- ── MAIN BODY ── -->
  <ellipse cx="32" cy="34" rx="20" ry="17" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- ── SEGMENT RIDGES ── -->
  <path d="M32 17 Q30 34 32 51" stroke="#7A5500" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M16 24 Q24 34 22 47" stroke="#7A5500" stroke-width="1.0" fill="none" opacity="0.5"/>
  <path d="M48 24 Q40 34 42 47" stroke="#7A5500" stroke-width="1.0" fill="none" opacity="0.5"/>
  <path d="M14 38 Q24 30 26 42" stroke="#7A5500" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M50 38 Q40 30 38 42" stroke="#7A5500" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- ── HIGHLIGHT / SHEEN ── -->
  <ellipse cx="26" cy="27" rx="7" ry="4.5" fill="white" opacity="0.15" transform="rotate(-25,26,27)"/>

  <!-- ── INNER GLOW ── -->
  <ellipse cx="32" cy="34" rx="9" ry="7" fill="url(#fleshGrad)" opacity="0.20"/>

  <!-- ── STEM ── -->
  <rect x="30" y="7" width="4" height="12" rx="2" fill="#6B4510"/>
  <rect x="30.5" y="7" width="1.2" height="10" rx="1" fill="#8B6520" opacity="0.6"/>

  <!-- ── LEAVES ── -->
  <ellipse cx="37" cy="9"  rx="6" ry="2.5" fill="#2E8018" stroke="#1A5010" stroke-width="0.5" transform="rotate(-35,37,9)"/>
  <ellipse cx="27" cy="8"  rx="5" ry="2"   fill="#3A9020" stroke="#1A5010" stroke-width="0.5" transform="rotate(20,27,8)"/>
  <ellipse cx="33" cy="6"  rx="4" ry="1.8" fill="#248015" stroke="#1A5010" stroke-width="0.5" transform="rotate(-5,33,6)"/>
</svg>
